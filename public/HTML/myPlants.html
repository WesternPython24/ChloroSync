<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <script src="../scripts/plantData.js" defer></script>
</head>



<body>
    <header>
        <h2></h2>
        <nav class="nav-list">
            <a href="index.html">Home</a>
            <a href="myPlants.html">My Plants</a>
            <a href="help.html">Help</a>
        </nav>

    </header>

    <button id = addPlantSection>Add Plant Section</button>
    <div class="plantContiner">
        <section class="plantSection1"></section>
            <h1 id="plantSectionHeader">Plant Section Name</h1>
            <div class="plantEditDelete">
                <button id="EditPlant">Edit</button>
                <button id="deletePlant">Delete Section</button>
            </div>

            <div class="sensorReadingContainer">

                <div class="sensorReading" data-sensor="temperature">
                    <h2>Temperature</h2>
                    <p><span id="temperatureValue" class="value">--</span> &deg;C</p>
                </div>

                <div class="sensorReading" data-sensor="humidity">
                    <h2>Humidity</h2>
                    <p><span id="humidityValue" class="value">--</span> %</p>
                </div>
                <div class="sensorReading" data-sensor="lightLevel">
                    <h2>Light Level</h2>
                    <p><span id="lightLevelValue" class="value">--</span> lux</p>

                </div>

                

                <div class = plantData></div>

                    <div class = "moistureReading" data-sensor="groundMoisture">
                        <h1> Plant 1 </h1>
                        <h2>Ground Moisture</h2>
                        <p><span id="GroundMoistureValue" class="value">--</span>%</p>
                        <button>delete</button>
                        <button>edit </button>
                    </div>

                    <div class = "moistureReading" data-sensor="groundMoisture">
                        <h1> Plant 2 </h1>
                        <h2>Ground Moisture</h2>
                        <p><span id="GroundMoistureValue" class="value">--</span>%</p>
                        <button>delete</button>
                        <button>edit</button>
                    </div>

                </div>

                <button id="addPlant">Add Plant</button>

            </div>
        </section>
    </div>

    
</body>



</html>
